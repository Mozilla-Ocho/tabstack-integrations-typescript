name: Release

# Tag-driven publishing. Create a GitHub Release whose tag names the target:
#   langchain-vX.Y.Z  -> publish only @tabstack/langchain at X.Y.Z
#   ai-vX.Y.Z         -> publish only @tabstack/ai at X.Y.Z
#   eve-vX.Y.Z        -> publish only @tabstack/eve at X.Y.Z
#   mastra-vX.Y.Z     -> publish only @tabstack/mastra at X.Y.Z
#   claude-vX.Y.Z     -> publish only @tabstack/claude-agent at X.Y.Z
#   openai-vX.Y.Z     -> publish only @tabstack/openai-agents at X.Y.Z
#   llama-vX.Y.Z      -> publish only @tabstack/llamaindex at X.Y.Z
#   pi-vX.Y.Z         -> publish only @tabstack/pi-agent at X.Y.Z
#   vX.Y.Z            -> publish all at X.Y.Z
#
# The tag's version is written into the target package.json(s) at build time
# (not committed back); the GitHub Release is the source of truth. Publishing
# uses npm OIDC trusted publishing (no NPM_TOKEN), configured per package on
# npmjs.com. Provenance is requested by the publish step via --provenance, gated
# on repository visibility (see the note on that step).
# Prerelease versions (e.g. 1.2.0-beta.1) publish under the `next` dist-tag.
on:
  release:
    types: [published]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - name: Parse release tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          PREFIXES="langchain, ai, eve, mastra, claude, openai, llama, pi"

          # Split an optional "<package>-" prefix from the "vX.Y.Z" version.
          if [[ "$TAG" =~ ^([a-z0-9-]+)-v(.+)$ ]]; then
            NAME="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^v(.+)$ ]]; then
            NAME=""
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$TAG' must look like vX.Y.Z (all packages) or <package>-vX.Y.Z where <package> is one of: $PREFIXES"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::'$VERSION' (from tag '$TAG') is not a valid semver version"
            exit 1
          fi

          # Map the tag prefix to the pnpm package(s) to publish.
          case "$NAME" in
            "")          PKGS="@tabstack/langchain @tabstack/ai @tabstack/eve @tabstack/mastra @tabstack/claude-agent @tabstack/openai-agents @tabstack/llamaindex @tabstack/pi-agent" ;;
            langchain)   PKGS="@tabstack/langchain" ;;
            ai)          PKGS="@tabstack/ai" ;;
            eve)         PKGS="@tabstack/eve" ;;
            mastra)      PKGS="@tabstack/mastra" ;;
            claude)      PKGS="@tabstack/claude-agent" ;;
            openai)      PKGS="@tabstack/openai-agents" ;;
            llama)       PKGS="@tabstack/llamaindex" ;;
            pi)          PKGS="@tabstack/pi-agent" ;;
            *)           echo "::error::Unknown package '$NAME' in tag '$TAG' (expected one of: $PREFIXES)"; exit 1 ;;
          esac

          # Prerelease versions must not claim the default `latest` dist-tag.
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing [$PKGS] at $VERSION (dist-tag: $NPM_TAG)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No registry-url here on purpose: it would make setup-node write an
      # .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and an unset token there can
      # shadow the OIDC exchange. OIDC needs no token or .npmrc auth line.
      # (pnpm/pnpm#11513 presents this way but was resolved by updating
      # pnpm/action-setup — keep that action current if OIDC starts 404ing.)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the publishable packages (and their deps) are needed to build and
      # publish. Scoping the install keeps the demo apps under apps/* and their
      # heavy deps (eve, ai) out of the trusted-publishing environment.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./packages/*..."

      - name: Set target versions
        run: |
          set -euo pipefail
          for PKG in ${{ steps.tag.outputs.pkgs }}; do
            pnpm --filter "$PKG" exec npm pkg set version="${{ steps.tag.outputs.version }}"
          done

      # core builds first (workspace dependency of the adapters); `pnpm -r`
      # builds in topological order.
      - name: Build
        run: pnpm build

      # The artifact assertion, run where it cannot be skipped. Packs each target
      # exactly as publish would, reads the manifest back out of the tarball and
      # asserts every path it advertises through main/module/types/exports is
      # inside. `prepublishOnly` rebuilds but asserts nothing, so without this a
      # build that silently emits no dist/ still publishes — that is exactly how
      # @tabstack/pi-agent@0.1.0 shipped. `pnpm pack` does not run
      # `prepublishOnly`, so this checks what the build step above produced.
      - name: Assert built artifacts
        run: |
          set -euo pipefail
          for PKG in ${{ steps.tag.outputs.pkgs }}; do
            node scripts/release.mjs check-artifact "$PKG"
          done

      # pnpm publish rewrites `workspace:*` deps to real versions and does OIDC
      # trusted publishing natively. --access comes from each package's
      # publishConfig. --no-git-checks: the tree carries the in-place version
      # bump and we're on a detached tag.
      #
      # Provenance is a flag rather than a publishConfig key because npm dropped
      # support for attestations from private source repositories in July 2023,
      # and an explicit request is a hard publish failure there rather than a
      # graceful skip. Gating on the release event's visibility means flipping
      # this repo public turns attestations on with no edit here.
      - name: Publish to npm
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          # Seeded with the always-on flags so the array is never empty: under
          # `set -u`, expanding an empty array aborts on bash < 4.4.
          ARGS=(--no-git-checks --tag "${{ steps.tag.outputs.npm_tag }}")
          if [[ "$REPO_PRIVATE" == "false" ]]; then
            ARGS+=(--provenance)
            echo "Public repository: publishing with provenance attestations."
          else
            echo "::warning::Private source repository — publishing without provenance. Make the repo public to get attestations."
          fi

          for PKG in ${{ steps.tag.outputs.pkgs }}; do
            echo "Publishing $PKG"
            pnpm --filter "$PKG" publish "${ARGS[@]}"
          done
