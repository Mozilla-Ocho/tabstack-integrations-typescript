name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # core must build before the adapters typecheck and test, since they
      # consume it as a workspace dependency. pnpm -r builds in topological order.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The demo apps consume the adapters through their built dist, so this is
      # the only check that exercises the published type surface (and catches a
      # peer range, such as zod, drifting between packages/ and apps/).
      - name: Typecheck demos
        run: pnpm demos:typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
